<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Restaurant System</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <main class="auth-page">
    <div class="auth-card">

      <!-- Brand -->
      <div class="auth-brand">
        <div class="logo">
          <!-- Chef hat -->
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3a4.5 4.5 0 0 0-4.24 3A4 4 0 0 0 6 13.75V19a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-5.25A4 4 0 0 0 16.24 6 4.5 4.5 0 0 0 12 3Zm-4 14h8v1H8v-1Z"/>
          </svg>
        </div>
        <h1>Restaurant System</h1>
        <p>Sign in to continue</p>
      </div>

      <!-- Login form -->
      <form class="auth-body" action="select-view.html" method="get">
        <div class="form-group input-icon">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>
          </svg>
          <input class="form-control" type="text" name="username" placeholder="Username" aria-label="Username" required>
        </div>

        <div class="form-group input-icon">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
          </svg>
          <input class="form-control" type="password" name="password" placeholder="Password" aria-label="Password" required>
        </div>

        <div class="auth-row">
          <label><input type="checkbox" name="remember"> Remember me</label>
          <a href="#">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg">Login</button>
      </form>

      <p class="auth-footer">&copy; 2026 Restaurant System</p>
    </div>
  </main>

</body>
</html>
